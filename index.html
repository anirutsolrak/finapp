<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F1F6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2B2C38" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finanças" />
    <title>FinançasFamília</title>
    <script>
      // Define o tema antes da primeira pintura: escolha salva em Configurações ou o do sistema.
      // shortcut: trocar o tema do sistema com o app aberto só reflete ao reabrir; ouvir matchMedia se incomodar.
      document.documentElement.dataset.theme = localStorage.getItem('finapp:theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
